<!DOCTYPE html>
<html>
<head>
    <title>ConnieNail 서버 테스트</title>
    <meta charset="utf-8">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 50px;
            background: linear-gradient(135deg, #fce7f3, #e0e7ff);
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #e11d48; margin-bottom: 20px; }
        .status { 
            background: #dcfce7; 
            padding: 20px; 
            border-radius: 8px; 
            margin: 20px 0; 
            border: 2px solid #16a34a;
        }
        .links a {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            background: #e11d48;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .links a:hover {
            background: #be185d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸 ConnieNail 서버 테스트</h1>
        <div class="status">
            <h2>✅ 서버가 정상적으로 작동 중입니다!</h2>
            <p><strong>포트:</strong> 5000</p>
            <p><strong>상태:</strong> Next.js 애플리케이션 실행 중</p>
            <p><strong>시간:</strong> <span id="time"></span></p>
        </div>
        
        <div class="links">
            <h3>🔗 ConnieNail 페이지 링크:</h3>
            <a href="/">🏠 홈페이지</a>
            <a href="/admin">👩‍💼 관리자</a>
            <a href="/booking">📅 예약</a>
            <a href="/services">💅 서비스</a>
            <a href="/gallery">🖼️ 갤러리</a>
            <a href="/contact">📞 연락처</a>
        </div>
    </div>
    
    <script>
        // 현재 시간 표시
        function updateTime() {
            document.getElementById('time').textContent = new Date().toLocaleString('ko-KR');
        }
        updateTime();
        setInterval(updateTime, 1000);
        
        // 페이지 로드 확인
        console.log('ConnieNail 테스트 페이지 로드됨');
    </script>
</body>
</html>
